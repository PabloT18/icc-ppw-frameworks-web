<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular - Material y Prácticas | ICC PPW</title>
    <link rel="stylesheet" href="styles/institutional.css">
    
    <!-- ===== SCRIPTS DE DATOS Y RENDERIZADO ===== -->
    <!-- Cargar primero los datos, luego el renderizador -->
    <script defer src="scripts/content-data.js"></script>
    <script defer src="scripts/render-modules.js"></script>
    
    <style>
        /* Estilos específicos para Angular */
        .content-item {
            border-left: 4px solid #e82936;
        }

        .content-link {
            background: #fb313e;
        }

        .content-link:hover {
            background: #e82936;
        }

        .content-link.secondary {
            background: var(--color-primary-soft);
        }

        .content-link.secondary:hover {
            background: var(--color-primary);
        }

        .hero img {
            filter: drop-shadow(0 4px 8px rgba(221, 0, 49, 0.3));
        }
    </style>
</head>
<body data-framework="angular">
    <div class="layout-container">
        <a href="../docs/index.html" class="back-btn">Volver al Inicio</a>

        <div class="hero">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/angular/angular-original.svg" alt="Angular Logo">
            <h1>Angular Framework</h1>
            <p>Material Conceptual y Prácticas</p>
        </div>

        <div class="section">
            <h2>Material Conceptual</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="modules-container">
                <!-- Los módulos se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Recursos de Aprendizaje</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="resources-container">
                <!-- Los recursos se cargan aquí dinámicamente -->
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Universidad Politécnica Salesiana - ICC</p>
            <p>Programación y Plataformas Web - Angular Framework</p>
        </footer>
    </div>
</body>
</html>
