<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React - Material y Proyectos | ICC PPW</title>
    <link rel="stylesheet" href="styles/institutional.css">
    
    <!-- ===== SCRIPTS DE DATOS Y RENDERIZADO ===== -->
    <!-- Cargar primero los datos, luego el renderizador -->
    <script defer src="scripts/content-data.js"></script>
    <script defer src="scripts/render-modules.js"></script>
    
    <style>
        /* Estilos específicos para React */
        .content-item {
            border-left: 4px solid #61DAFB;
        }

        .content-link {
            background: #61DAFB;
            color: #282C34;
        }

        .content-link:hover {
            background: #4FA8C5;
        }

        .content-link.secondary {
            background: var(--color-primary-soft);
            color: white;
        }

        .content-link.secondary:hover {
            background: var(--color-primary);
        }

        .hero img {
            filter: drop-shadow(0 4px 8px rgba(97, 218, 251, 0.3));
        }
    </style>
</head>
<body data-framework="react">
    <div class="layout-container">
        <a href="../docs/index.html" class="back-btn">Volver al Inicio</a>

        <div class="hero">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React Logo">
            <h1>React Framework</h1>
            <p>Material y Proyectos de Estudiantes</p>
        </div>

        <div class="section">
            <h2>Módulos del Curso</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="modules-container">
                <!-- Los proyectos se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Módulos del Complementarios</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="modules-container-complementarios">
                <!-- Los proyectos se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Recursos de Aprendizaje</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="resources-container">
                <!-- Los recursos se cargan aquí dinámicamente -->
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Universidad Politécnica Salesiana - ICC</p>
            <p>Programación y Plataformas Web - React Framework</p>
        </footer>
    </div>
</body>
</html>
