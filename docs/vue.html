<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue - Material y Proyectos | ICC PPW</title>
    <link rel="stylesheet" href="styles/institutional.css">
    
    <!-- ===== SCRIPTS DE DATOS Y RENDERIZADO ===== -->
    <!-- Cargar primero los datos, luego el renderizador -->
    <script defer src="scripts/content-data.js"></script>
    <script defer src="scripts/render-modules.js"></script>
    
    <style>
        /* Estilos específicos para Vue */
        .content-item {
            border-left: 4px solid #42B883;
        }

        .content-link {
            background: #42B883;
            color: white;
        }

        .content-link:hover {
            background: #35495E;
        }

        .content-link.secondary {
            background: #35495E;
        }

        .content-link.secondary:hover {
            background: #42B883;
        }

        .hero img {
            filter: drop-shadow(0 4px 8px rgba(66, 184, 131, 0.3));
        }
    </style>
</head>
<body data-framework="vue">
    <div class="layout-container">
        <a href="../docs/index.html" class="back-btn">Volver al Inicio</a>

        <div class="hero">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vuejs/vuejs-original.svg" alt="Vue Logo">
            <h1>Vue Framework</h1>
            <p>Material y Proyectos de Estudiantes</p>
        </div>

        <div class="section">
            <h2>Proyectos de Estudiantes</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="modules-container">
                <!-- Los proyectos se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Recursos de Aprendizaje</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="resources-container">
                <!-- Los recursos se cargan aquí dinámicamente -->
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Universidad Politécnica Salesiana - ICC</p>
            <p>Programación y Plataformas Web - Vue Framework</p>
        </footer>
    </div>
</body>
</html>
