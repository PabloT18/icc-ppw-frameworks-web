<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro - Material y Prácticas | ICC PPW</title>
    <link rel="stylesheet" href="styles/institutional.css">
    
    <!-- ===== SCRIPTS DE DATOS Y RENDERIZADO ===== -->
    <!-- Cargar primero los datos, luego el renderizador -->
    <script defer src="scripts/content-data.js"></script>
    <script defer src="scripts/render-modules.js"></script>
    
    <style>
        /* Estilos específicos para Astro */
        .content-item {
            border-left: 4px solid #FF5D01;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }

        .content-link {
            background: #fa7427;
            color: white;
        }

        .content-link:hover {
            background: #FF5D01;
        }


        .hero img {
            filter: drop-shadow(0 4px 4px rgba(251, 102, 15, 0.554));
        }
    </style>
</head>
<body data-framework="astro">
    <div class="layout-container">
        <a href="../docs/index.html" class="back-btn">Volver al Inicio</a>

        <div class="hero">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/astro/astro-original.svg" alt="Astro Logo">
            <h1>Astro Framework</h1>
            <p>Material Conceptual y Prácticas</p>
        </div>

        <div class="section">
            <h2>Material Conceptual</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="modules-container">
                <!-- Los módulos se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Características de Astro</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="features-container">
                <!-- Las características se cargan aquí dinámicamente -->
            </div>
        </div>

        <div class="section">
            <h2>Recursos de Aprendizaje</h2>
            
            <!-- El contenido se genera dinámicamente desde render-modules.js -->
            <div class="card-grid" id="resources-container">
                <!-- Los recursos se cargan aquí dinámicamente -->
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Universidad Politécnica Salesiana - ICC</p>
            <p>Programación y Plataformas Web - Astro Framework</p>
        </footer>
    </div>
</body>
</html>
